name: Run ELT Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '21 2 * * *'     # 02h21 UTC, soit 04h21 en France l'été

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v5

      - name: ☁️ Authentification GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.CLAWYUNKAI_GCP_SA_KEY }}'

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 📦 Installation des dépendances
        working-directory: ./clawyunkai
        run: uv sync

      - name: 🔑 Profil dbt
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          wild_data_hub:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: les-fourcasters
                dataset: dbt_dev
                keyfile: ${{ steps.auth.outputs.credentials_file_path }}
                location: us-central1
                threads: 4
          EOF

      - name: 🚀 1. Ingestion API → BigQuery
        working-directory: ./clawyunkai
        run: uv run python 01_Ingestion_API.py

      - name: 🛠️ 2. Transformation dbt
        working-directory: ./clawyunkai/wild_data_hub
        run: uv run dbt build

      - name: 🔮 3. Prédiction canicule
        working-directory: ./clawyunkai
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: uv run python 02_predict.py