name: Run ELT Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Toutes les 6 heures
  workflow_dispatch:      # Bouton de lancement manuel

jobs:
  run-elt:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        
      - name: ☁️ Authentification GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          
      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: 📦 Installation des dépendances
        run: uv sync # Utilise votre fichier uv.lock
        
      - name: 🚀 Lancement du Pipeline
        # On dit à GitHub d'aller dans le bon dossier avant de lancer uv
        working-directory: ./2026.08_Les_Fourcasters/clawyunkai
        run: uv run python run_pipeline.py